stance:
  hawkish:
    title: Жёсткая ДКП
    description: Сигнал в пользу более высокой или дольше высокой ставки.
  dovish:
    title: Мягкая ДКП
    description: Сигнал в пользу снижения ставки или смягчения условий.
  proinflationary_risk:
    title: Проинфляционный риск
    description: Фактор, который может ускорить рост цен.
  disinflationary:
    title: Дезинфляционный
    description: Фактор или оценка в пользу замедления инфляции.
  positive:
    title: Позитив
    description: Благоприятная оценка для спроса, прибыли или рынка.
  negative:
    title: Негатив
    description: Неблагоприятная оценка для спроса, прибыли или рынка.
  neutral:
    title: Нейтрально
    description: Констатация без выраженного направления.

