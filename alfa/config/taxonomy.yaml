# Таксономия дня 2. Коды — источник истины для enum в коде.
# topic совпадает с event_type по бизнес-релевантным кодам, чтобы тема новости
# и тема карточки аналитики стыковались без отдельного маппинга.

event_type:
  key_rate:
    title: Ставка ЦБ
    description: Решение, сигнал или ожидание по ключевой ставке Банка России и денежно-кредитной политике.
    examples:
      - ЦБ сохранил ключевую ставку на уровне 14%.
      - Аналитики ждут паузы на заседании по ставке 23 октября.
  fx:
    title: Курс
    description: Официальный или рыночный курс рубля, интервенции и покупки валюты.
    examples:
      - Курс доллара на Forex опустился ниже 82 рублей.
      - Банк России купил юани на 12,1 млрд рублей.
  inflation:
    title: Инфляция
    description: Фактическая инфляция, инфляционные ожидания и прогнозы цен.
    examples:
      - Недельная инфляция с 6 по 12 октября составила 0,11%.
      - Аналитики повысили прогноз инфляции до 7,1% на 2026 год.
  sanctions_trade:
    title: Санкции и ВЭД
    description: Санкции, расчёты с нерезидентами, экспорт и импорт, ограничения внешней торговли.
    examples:
      - Суд запретил банку закрыть счёт оператора проектов «Газпрома».
      - Криптобиржа объявила об уходе из России.
  taxes:
    title: Налоги
    description: Налоговые ставки, режимы, льготы и нагрузка на бизнес или граждан.
    examples:
      - Минфин обсудит продление налогового режима для самозанятых.
      - Володин предложил отменить льготный НДС на деликатесы.
  commodities_gold:
    title: Сырьё и золото
    description: Цены и налоги на нефть, металлы, золото и другое сырьё.
    examples:
      - Brent превысила 111 долларов за баррель.
      - В Думе обсуждают повышение налогов для золотодобычи.
  labor:
    title: Рынок труда
    description: Зарплаты, МРОТ, занятость и безработица.
    examples:
      - МРОТ в 2027 году составит 28 935 рублей.
      - Безработица в июне выросла до 2,2%.
  consumer_demand:
    title: Потребительский спрос
    description: Розница, потребление домохозяйств, продажи и спрос населения.
    examples:
      - Ozon обогнал Wildberries по доле продаж.
      - Импорт яиц сократился на 10,1%.
  sector_regulation:
    title: Отраслевое регулирование
    description: Тарифы, лицензии, отраслевые правила и ограничения для компаний.
    examples:
      - ФАС подключит 21 регион к цифровому тарифному регулированию.
      - Расширен тарифный коридор страхования опасных объектов.
  ma:
    title: M&A
    description: Сделки слияния и поглощения, выкуп акций, IPO и pre-IPO.
    examples:
      - GloraX выкупит акции у участников IPO с премией 19,5%.
      - Инвестплатформа продолжит pre-IPO в ноябре.
  other_econ:
    title: Прочее экономическое
    description: Значимое для бизнеса экономическое событие, которое не попало в типы выше.
    examples:
      - Крымские предприятия получат более 4,6 млрд рублей поддержки.
      - Доля облигаций в привлечённых средствах составила 31%.
  irrelevant:
    title: Нерелевантное
    description: Спорт, культура, протокольные и бытовые новости без последствия для бизнеса клиента.
    examples:
      - Банк России приглашает студентов на чемпионат по кибербезопасности.
      - Продажи Монетного двора США выросли на фоне коллекционной монеты.

