# Клиентские последствия: уточнения к шаблонам mechanisms.yaml.
# Extraction risks/opportunities из новости — только grounded span (evidence),
# не единственный источник ответа клиенту. Интерпретация — отдельный слой.
#
# Приоритет шаблона risk/opportunity/watch (выше = специфичнее):
#   1) by_field[field][value][mechanism]
#   2) event_matrix[event_type][mechanism]
#   3) defaults из mechanisms.yaml
#
# Сценарии: scenario_matrix[field][value] → список {name, logic, plausibility, use_calc?}.
# Ключ unknown — пустое / unknown / нет точного совпадения. В коде — только fallback
# «базовый / негативный / условный» по механизмам, без хардкода веток поля.
#
# Плейсхолдеры те же: {factor}, {reason}, {industry_label}, {debt_rate_type},
# {fx_expense_share}, {fx_revenue_share}, {debt_amount}, {debt_maturity}, {event_type}.
version: consequences-v1

scenario_matrix:
  debt_rate_type:
    floating:
      - name: базовый
        logic: "Рост ключевой ставки поднимает платёж по долгу компании при плавающей ставке."
        plausibility: high
        use_calc: true
      - name: негативный
        logic: "Крупный шаг по ключу сильнее поднимает платёж; масштаб опирается на calc при наличии."
        plausibility: medium
        use_calc: true
      - name: условный
        logic: "Если бы ставка была фиксированной, решение по ключу платёж не пересчитало бы."
        plausibility: low
    fixed:
      - name: базовый
        logic: "Решение по ключевой ставке само по себе платёж не пересчитывает."
        plausibility: high
      - name: негативный
        logic: "Давление ставки остаётся на рефинансировании и новых договорах."
        plausibility: medium
      - name: условный
        logic: "При плавающей ставке тот же шаг по ключу поднял бы платёж."
        plausibility: low
        use_calc: true
    unknown:
      - name: плавающая ставка
        logic: "Если ставка плавающая, рост ключа поднимает платёж компании."
        plausibility: medium
        use_calc: true
      - name: фиксированная ставка
        logic: "Если ставка фиксированная, решение по ключу платёж не пересчитывает."
        plausibility: medium
  fx_expense_share:
    high:
      - name: базовый
        logic: "Курс сильнее отражается на затратах компании при высокой FX-доле."
        plausibility: high
      - name: негативный
        logic: "Неблагоприятный курс при высокой доле сильнее бьёт по затратам."
        plausibility: medium
        use_calc: true
      - name: условный
        logic: "При низкой доле прямой удар курса по затратам слабее."
        plausibility: low
    low:
      - name: базовый
        logic: "Прямой удар курса по затратам компании ограничен."
        plausibility: high
      - name: негативный
        logic: "При росте FX-доли курс сильнее бьёт по затратам."
        plausibility: low
      - name: условный
        logic: "Нейтральный эффект при текущих признаках по прямому FX-контуру при низкой доле расходов."
        plausibility: medium
    unknown:
      - name: базовый
        logic: "Если доля FX mid/high, курс сильнее бьёт по затратам."
        plausibility: medium
      - name: негативный
        logic: "Если валютная доля расходов заметна, неблагоприятный курс усиливает затраты."
        plausibility: medium
        use_calc: true
      - name: условный
        logic: "Если валютная доля расходов мала, прямой удар курса ограничен."
        plausibility: medium

by_field:
  debt_rate_type:
    floating:
      debt_service_cost:
        risk_template: "Плавающая ставка: рост ключевой ставки поднимает платёж по {factor}."
        opportunity_template: "Плавающий долг: пауза или снижение ставки может удержать или снизить платёж по {factor}."
        watch_template: "Следить за шагом ключевой ставки и пересчётом платежа по {factor}."
    fixed:
      debt_service_cost:
        risk_template: "Нейтральный эффект по прямому платежу при фиксированной ставке; рефинансирование и новые договоры по {factor} остаются под давлением ставки."
        opportunity_template: "Фиксированная ставка защищает текущий платёж по {factor} от решения по ключу."
        watch_template: "Следить за рефинансированием и условиями новых договоров по {factor}."
  fx_expense_share:
    high:
      fx_cost:
        risk_template: "Высокая доля валютных расходов: движение курса сильнее бьёт по затратам в {factor}."
        opportunity_template: "При благоприятном курсе высокая FX-доля быстрее снижает затраты в {factor}."
        watch_template: "Следить за курсом и высокой долей FX-расходов в {factor}."
      import_restrictions:
        risk_template: "Высокая валютная доля расходов усиливает удар ограничений по {factor}."
        opportunity_template: "Смягчение ограничений при высокой FX-доле заметнее облегчает {factor}."
        watch_template: "Следить за ВЭД-ограничениями при высокой FX-доле в {factor}."
    mid:
      fx_cost:
        risk_template: "При доле FX mid курс умеренно усиливает валютную стоимость операций в {factor}."
        opportunity_template: "При благоприятном курсе средняя FX-доля умеренно снижает затраты в {factor}."
        watch_template: "Следить за курсом при средней FX-доле расходов в {factor}."
      import_restrictions:
        risk_template: "При доле FX mid ограничения умеренно давят на {factor}."
        opportunity_template: "Смягчение ограничений при средней FX-доле умеренно облегчает {factor}."
        watch_template: "Следить за ВЭД-ограничениями при средней FX-доле в {factor}."
    low:
      fx_cost:
        risk_template: "Нейтральный эффект: низкая доля валютных расходов ограничивает прямой удар курса по {factor}, но контур всё ещё чувствителен."
        opportunity_template: "Низкая валютная доля расходов сдерживает рост затрат при движении курса в {factor}."
        watch_template: "Следить, не растёт ли FX-доля расходов в {factor}."
      import_restrictions:
        risk_template: "Низкая FX-доля сдерживает прямой удар ограничений по затратам в {factor}, но срывы поставок остаются риском."
        opportunity_template: "Низкая FX-доля ограничивает валютный удар; смягчение ограничений всё равно облегчает {factor}."
        watch_template: "Следить за срывами поставок в {factor} даже при низкой FX-доле."

