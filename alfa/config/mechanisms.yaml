  regulatory_cost:
    directness: direct
    sensitivity_requires: [industry_group]
    critical_fields: []
    optional_fields: []
    changes_conclusion: []
    risk_template: "Новые отраслевые правила могут увеличить стоимость деятельности через {factor} в {industry_label} ({reason})."
    opportunity_template: "Отсрочка жёстких правил может удержать стоимость деятельности через {factor}."
    watch_template: "Смотреть отраслевые правила и стоимость соответствия в {industry_label}."
    presentation:
      headline: "Регуляторика: растёт стоимость деятельности в отрасли"
      factor: "отраслевых правил"
      effect: "меняется стоимость деятельности"
