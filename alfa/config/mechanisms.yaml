    optional_fields: []
    changes_conclusion: []
    risk_template: "Санкционный контур может повысить риск по {factor} ({reason})."
    opportunity_template: "Прояснение санкционного контура может снизить неопределённость по {factor}."
    watch_template: "Смотреть условия гарантий и расчётов в {factor}."
    presentation:
      headline: "Гарантии: растёт риск по расчётам"
      factor: "гарантий и расчётов"
      effect: "растёт риск по гарантиям и расчётам"
      feature_ref: has_guarantees
    tools:
      - {tool: get_profile_view, args: {}}
      - {tool: get_counterparties, args: {direction: both}}
      - {tool: search_alfa_analytics, args: {topic: sanctions_trade}}
    optional_tools: []
