  guarantee_risk:
    directness: direct
    sensitivity_requires: [has_guarantees]
    critical_fields: []
    optional_fields: []
    changes_conclusion: []
    tools:
      - {tool: get_profile_view, args: {}}
      - {tool: get_counterparties, args: {direction: both}}
      - {tool: search_alfa_analytics, args: {topic: sanctions_trade}}
    optional_tools: []
