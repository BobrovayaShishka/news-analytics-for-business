[project]
name = "alfa-hackaton"
version = "0.2.0"
description = "Профили компаний, сбор новостей и персональная лента. Полная установка: pip install -r requirements-dev.txt. Env: ALFA_LLM_API_KEY, ALFA_LOG_LEVEL."
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "numpy==2.5.4",
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "rank-bm25==0.2.2",
  "pymorphy3==2.0.6",
  "pymorphy3-dicts-ru==2.4.417150.4580142",
  "feedparser==6.0.14",
  "trafilatura==2.3.1",
  "lxml==6.1.3",
  "readability-lxml==0.8.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["alfa/tests", "tests"]
